<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Redirecting to try</title>
    <meta http-equiv="refresh" content="0; url=https://github.com/binpash/try">
    <link rel="canonical" href="https://github.com/binpash/try">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
      window.location.replace("https://github.com/binpash/try");
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="https://github.com/binpash/try">https://github.com/binpash/try</a>.</p>
  </body>
</html>
